apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: circleguard-dev
resources:
- ../../base
labels:
- pairs:
    environment: dev
  includeSelectors: false
patches:
- target:
    kind: ConfigMap
    name: circleguard-config
  patch: |-
    - op: replace
      path: /data/CG_ENVIRONMENT
      value: dev
    - op: replace
      path: /data/ENVIRONMENT
      value: dev
