# Reverse proxy of the CircleGuard web client (HU-02).
# The Expo export calls same-origin paths (/auth, /identity, ...); nginx forwards
# each prefix to the matching Compose service and strips the prefix.
# HU-14: TLS is terminated by the Traefik ingress (deploy/k8s/components/tls) and reaches this nginx as plain HTTP with
# X-Forwarded-Proto: https. HSTS is sent only in that case, so plain-HTTP access (and the kubelet probes) is unaffected.
map $http_x_forwarded_proto $cg_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # HU-15/HU-14: same security headers as mobile/nginx.conf (found by the OWASP ZAP baseline). Keep both files in step.
    # The CSP allows the one inline script of the Expo export by its SHA-256, so 'unsafe-inline' is NOT enabled for scripts.
    # tests/e2e-playwright/tests/security-headers.spec.ts fails visibly if the policy and the application diverge.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security $cg_hsts always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/[^/]+/actuator(?!/health) {
        return 404;
    }

    location /auth/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://auth:8180/;
    }

    location /identity/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://identity:8083/;
    }

    location /dashboard/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://dashboard:8084/;
    }

    location /file/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://file:8085/;
    }

    location /form/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://form:8086/;
    }

    location /gateway/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://gateway:8087/;
    }

    location /notification/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://notification:8082/;
    }

    location /promotion/ {
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://promotion:8088/;
    }

    # Expo static export with expo-router: serve generated HTML and fall back to the SPA shell.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
