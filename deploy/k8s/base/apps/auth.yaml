apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
    app.kubernetes.io/part-of: circleguard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        app.kubernetes.io/part-of: circleguard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8180"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: auth
        image: __REGISTRY__/circleguard-auth-service:__TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8180
        envFrom:
        - configMapRef:
            name: circleguard-config
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_auth
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: circleguard-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: circleguard-secrets
              key: POSTGRES_PASSWORD
        - name: LDAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: circleguard-secrets
              key: LDAP_ADMIN_PASSWORD
        - name: CG_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: circleguard-secrets
              key: CG_JWT_SECRET
        - name: CG_QR_SECRET
          valueFrom:
            secretKeyRef:
              name: circleguard-secrets
              key: CG_QR_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app: auth
    app.kubernetes.io/part-of: circleguard
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
  - name: http
    port: 8180
    targetPort: http
