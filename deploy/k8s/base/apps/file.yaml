apiVersion: apps/v1
kind: Deployment
metadata:
  name: file
  labels:
    app: file
    app.kubernetes.io/part-of: circleguard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: file
  template:
    metadata:
      labels:
        app: file
        app.kubernetes.io/part-of: circleguard
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: file
        image: __REGISTRY__/circleguard-file-service:__TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8085
        envFrom:
        - configMapRef:
            name: circleguard-config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: file
  labels:
    app: file
    app.kubernetes.io/part-of: circleguard
spec:
  type: ClusterIP
  selector:
    app: file
  ports:
  - name: http
    port: 8085
    targetPort: http
