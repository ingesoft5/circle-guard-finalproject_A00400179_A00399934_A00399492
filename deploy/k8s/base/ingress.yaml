apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard
  labels:
    app.kubernetes.io/part-of: circleguard
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 8080
