apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/part-of: circleguard
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: circleguard
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: redis
        image: redis:7.2.5-alpine
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - --appendonly
        - "yes"
        ports:
        - name: tcp
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        startupProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/part-of: circleguard
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - name: tcp
    port: 6379
    targetPort: tcp
