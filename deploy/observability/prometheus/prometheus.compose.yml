# Prometheus for the full Docker Compose stack (service DNS names).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: circleguard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth:8180
          - identity:8083
          - form:8086
          - promotion:8088
          - notification:8082
          - gateway:8087
          - dashboard:8084
          - file:8085
        labels:
          environment: dev
          runtime: compose
