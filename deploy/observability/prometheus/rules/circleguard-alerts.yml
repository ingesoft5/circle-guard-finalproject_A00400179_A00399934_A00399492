groups:
  - name: circleguard-critical
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (application) (rate(http_server_requests_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 5% in {{ $labels.application }}"
          runbook: "docs/operacion/observabilidad.md#9-investigar-un-incidente"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s in {{ $labels.application }}"
          runbook: "docs/operacion/observabilidad.md#9-investigar-un-incidente"

      - alert: ServiceDown
        expr: up{job="circleguard"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not being scraped"
          runbook: "docs/operacion/manual-operaciones.md#7-recuperación-y-rollback"

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is open"
          runbook: "docs/arquitectura/patrones-diseno.md#c1-circuit-breaker-resilience4j--categoría-resiliencia-ca-03"

      - alert: PromotionConsumerLag
        # Optional: requires the Kafka client metrics binder. It does not fire if the metric is absent.
        expr: kafka_consumer_fetch_manager_records_lag_max{group="promotion-service-group"} > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Promotion consumer lag above 100 messages"
          runbook: "docs/operacion/observabilidad.md#9-investigar-un-incidente"
