# Prometheus for services running with `bootRun` on the host.
# Docker Desktop resolves host.docker.internal to the host loopback.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: circleguard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8180
          - host.docker.internal:8083
          - host.docker.internal:8086
          - host.docker.internal:8088
          - host.docker.internal:8082
          - host.docker.internal:8087
          - host.docker.internal:8084
          - host.docker.internal:8085
        labels:
          environment: dev
          runtime: local
