name: commit-lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar Conventional Commits
        run: |
          chmod +x scripts/check-conventional-commits.sh
          scripts/check-conventional-commits.sh "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
