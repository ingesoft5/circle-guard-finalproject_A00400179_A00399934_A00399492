spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: "${CG_JWT_SECRET}"
  expiration: 3600000

qr:
  secret: "${CG_QR_SECRET}"
  expiration: 300

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
