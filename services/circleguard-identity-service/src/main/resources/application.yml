spring:
  application:
    name: circleguard-identity-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_identity
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  secret: "${CG_VAULT_SECRET}"
  salt: "${CG_VAULT_SALT}"
  hash-salt: "${CG_VAULT_HASH_SALT}"

jwt:
  secret: "${CG_JWT_SECRET}"

server:
  port: 8083
