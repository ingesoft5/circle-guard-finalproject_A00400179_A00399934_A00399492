# Reverse proxy of the CircleGuard web client (HU-02).
# The Expo export calls same-origin paths (/auth, /identity, ...); nginx forwards
# each prefix to the matching Compose service and strips the prefix.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # Docker's embedded DNS, so a restarted service is re-resolved without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /auth/ {
        set $upstream auth:8180;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    location /identity/ {
        set $upstream identity:8083;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    location /dashboard/ {
        set $upstream dashboard:8084;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    location /file/ {
        set $upstream file:8085;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    location /form/ {
        set $upstream form:8086;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    location /gateway/ {
        set $upstream gateway:8087;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    location /notification/ {
        set $upstream notification:8082;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    location /promotion/ {
        set $upstream promotion:8088;
        include /etc/nginx/cg-proxy.inc;
        proxy_pass http://$upstream/;
    }

    # Expo static export with expo-router: serve generated HTML and fall back to the SPA shell.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
