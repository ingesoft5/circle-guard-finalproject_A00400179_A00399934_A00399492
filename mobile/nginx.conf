# Reverse proxy of the CircleGuard web client (HU-02).
# The Expo export calls same-origin paths (/auth, /identity, ...); nginx forwards
# each prefix to the matching Compose service and strips the prefix with an explicit rewrite
# (HU-14 fix: with a variable in proxy_pass nginx does not strip it, and the service received "/").
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # HU-15 (ZAP baseline findings): security headers on every response. "always" also covers error pages and proxied answers.
    # Content-Security-Policy is built for the Expo static export: one inline module script (allowed by its SHA-256, so
    # 'unsafe-inline' is NOT enabled for scripts), inline styles from react-native-web, same-origin API calls through this proxy,
    # data:/blob: images and camera frames for the QR scanner. If the export's inline script changes, its hash changes: the
    # tests/e2e-playwright/tests/security-headers.spec.ts fails visibly (CSP violation) instead of the policy being silently relaxed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Docker's embedded DNS, so a restarted service is re-resolved without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # HU-14/HU-13: only the health endpoints of the services are reachable from outside. Without this, /auth/actuator/prometheus
    # (exposed by HU-13 for Prometheus) would be public through the proxy. Same rule as deploy/k8s/base/nginx.conf.
    location ~ ^/[^/]+/actuator(?!/health) {
        return 404;
    }

    location /auth/ {
        set $upstream auth:8180;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /identity/ {
        set $upstream identity:8083;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/identity/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /dashboard/ {
        set $upstream dashboard:8084;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /file/ {
        set $upstream file:8085;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/file/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /form/ {
        set $upstream form:8086;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/form/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /gateway/ {
        set $upstream gateway:8087;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /notification/ {
        set $upstream notification:8082;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/notification/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /promotion/ {
        set $upstream promotion:8088;
        include /etc/nginx/cg-proxy.inc;
        rewrite ^/promotion/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # Expo static export with expo-router: serve generated HTML and fall back to the SPA shell.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
