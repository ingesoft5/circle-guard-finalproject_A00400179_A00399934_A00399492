# HU-14 · TLS terminator in front of the CircleGuard web client (nginx). Mounted as /etc/nginx/conf.d/default.conf in the
# unprivileged nginx image (it listens on 8443 and 8080 because a non-root process cannot bind 443 and 80; publish them as 443 and 80).
#
# Certificate and key are NOT in the image or in the repository: the Compose overlay mounts them read-only from a directory that
# lives outside Git (CG_TLS_DIR) as /etc/nginx/tls/fullchain.pem and /etc/nginx/tls/server.key.
#
# Protocols and ciphers: TLS 1.2 and 1.3 only, AEAD ciphers with forward secrecy (ECDHE), no session tickets (they weaken forward secrecy).
# The application (server web:8080) is unchanged: TLS ends here, inside the Compose network.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Plain HTTP only redirects (the health endpoint stays plain so a probe does not need the certificate).
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream web:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
