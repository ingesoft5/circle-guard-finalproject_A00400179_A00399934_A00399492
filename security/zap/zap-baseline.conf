# HU-15 · Rules file of the ZAP baseline scan (zap-baseline.py -c). Format: <rule id><TAB><IGNORE|INFO|WARN|FAIL><TAB>(optional name)
#
# Intentionally EMPTY of rule overrides: every passive rule keeps its default level (WARN), so every finding is reported.
# The blocking decision is not made here but by security/zap/evaluate-zap.sh with the threshold ZAP_BLOCK_RISK of security/policy.env.
# A rule may only be set to IGNORE with a written justification and an owner in the same pull request, as a comment right above it.
