# HU-14 · ALTERNATIVE to security/k8s/create-secrets.sh: let the cluster pull the secrets from AWS SSM Parameter Store itself with the
# External Secrets Operator. PREPARED, NOT APPLIED, NOT TESTED: it needs the cluster (HU-10), the operator installed in it, and an IAM
# role for the operator that can read /circleguard/<env>/* (HU-09 provisions IAM). There is no AWS account involved in this repository
# change and nothing was created in AWS.
#
# Advantage over create-secrets.sh: secrets are refreshed automatically (rotation in SSM reaches the cluster without a manual run) and no
# person or pipeline ever handles the values. Cost: one more component in the cluster and an IAM role to maintain.
# The CustomResourceDefinitions come with the operator; replace "dev" with the environment of the cluster.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1                 # replace with the region of the project
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets      # IRSA: a ServiceAccount of the operator bound to an IAM role (no access keys in the cluster)
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: circleguard-db
  namespace: circleguard
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-ssm, kind: ClusterSecretStore }
  target:
    name: circleguard-db                # the Secret that the pods reference (see secrets-consumption.example.yaml)
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef: { key: /circleguard/dev/POSTGRES_USER }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: /circleguard/dev/POSTGRES_PASSWORD }
# One ExternalSecret per entry group of security/k8s/secrets.catalog (circleguard-neo4j, -ldap, -jwt, -qr, -vault, grafana-admin).
