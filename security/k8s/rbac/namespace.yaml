# HU-14 · Namespace of the CircleGuard applications. PREPARED, NOT APPLIED: the cluster belongs to HU-10 (and HU-09 provisions it).
# The observability namespace is defined by HU-13 (deploy/k8s/observability/all-in-one.yaml) and is not repeated here.
#
# Pod Security Admission: "baseline" is enforced (no privileged pods, no host namespaces, no host paths) and "restricted"
# is only reported (warn and audit), so a workload that does not yet meet "restricted" is shown a warning instead of being rejected.
# Move enforce to "restricted" once the Deployments of HU-10 set runAsNonRoot, drop capabilities and a seccomp profile.
apiVersion: v1
kind: Namespace
metadata:
  name: circleguard
  labels:
    app.kubernetes.io/part-of: circleguard
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
