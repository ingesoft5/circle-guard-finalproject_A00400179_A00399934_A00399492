# HU-14 · Identity of the pipeline. Applied by a cluster administrator, once per environment (see kustomization.yaml and the overlays).
#
# The services themselves need no ServiceAccount of their own: HU-10 runs every pod with the automatic mounting of the API token turned off and
# none of the eight services talks to the Kubernetes API, so a pod has no API credential at all. The "default" ServiceAccount of each
# namespace is deliberately NOT configured here and has no binding (rbac-matrix.txt checks that it can do nothing).
#
# jenkins-deployer is the identity that Jenkins uses to roll out the manifests. It has NO long-lived token Secret: Jenkins obtains a
# short-lived token on demand, for example
#   kubectl -n circleguard-dev create token jenkins-deployer --duration=1h
# and keeps it only as a Jenkins credential. Its rights are in roles.yaml (circleguard-deployer).
apiVersion: v1
kind: ServiceAccount
metadata: { name: jenkins-deployer, namespace: circleguard, labels: { app.kubernetes.io/part-of: circleguard } }
automountServiceAccountToken: false
