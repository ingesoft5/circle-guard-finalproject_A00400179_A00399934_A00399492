# HU-14 · One ServiceAccount per service, with NO permissions and NO API token mounted. PREPARED, NOT APPLIED (HU-10).
#
# None of the eight services talks to the Kubernetes API (no Kubernetes client in any service), so each one gets its own
# identity (useful for audit and for NetworkPolicies) but zero rights, and the token is not mounted into the pod:
# a compromised container then has no credential to the API server. Do not reuse the "default" ServiceAccount.
#
# jenkins-deployer is the identity that Jenkins uses to roll out the manifests. It has NO long-lived token Secret: Jenkins
# obtains a short-lived token on demand, for example
#   kubectl -n circleguard create token jenkins-deployer --duration=1h
# and keeps it only as a Jenkins credential. Its rights are in roles.yaml (circleguard-deployer).
apiVersion: v1
kind: ServiceAccount
metadata: { name: auth-service, namespace: circleguard, labels: { app.kubernetes.io/part-of: circleguard } }
automountServiceAccountToken: false
---
