# HU-14 · EXAMPLE of how a service consumes its Secrets in Kubernetes. A template for HU-10, NOT part of any deployment: the Deployments
# of the services belong to HU-10. Image and replicas are placeholders.
#
# What it shows (the same rules apply to the other services, with the Secrets listed for each one in security/k8s/secrets.catalog):
#   - each variable is read with secretKeyRef from a purpose-specific Secret: the pod only receives the keys it needs;
#   - the pod uses its own ServiceAccount (security/k8s/rbac/serviceaccounts.yaml) and mounts NO API token;
#   - the container runs as a non-root user, cannot gain privileges, drops every capability, has a read-only root file system
#     (the JVM writes to /tmp, so that is an emptyDir) and uses the runtime default seccomp profile.
# That last block is what the "restricted" Pod Security level asks for (security/k8s/rbac/namespace.yaml warns about it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: circleguard
  labels: { app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: circleguard }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: auth-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: circleguard }
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: auth-service
          image: registry.example.invalid/circleguard/circleguard-auth-service:0.0.0   # placeholder: use the pinned semver tag
          ports:
            - containerPort: 8180
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: circleguard-db, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: circleguard-db, key: POSTGRES_PASSWORD } }
            - name: LDAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: circleguard-ldap, key: LDAP_ADMIN_PASSWORD } }
            - name: CG_JWT_SECRET
              valueFrom: { secretKeyRef: { name: circleguard-jwt, key: CG_JWT_SECRET } }
            - name: CG_QR_SECRET
              valueFrom: { secretKeyRef: { name: circleguard-qr, key: CG_QR_SECRET } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
