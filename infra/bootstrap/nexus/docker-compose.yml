# Nexus Repository Community Edition (HU-01): artifact registry of CircleGuard with the Docker
# hosted repository "circleguard-docker" (created through the REST API by configure.sh).
# Variables come from the .env that infra/bootstrap-nexus.sh writes next to this file.
name: circleguard-nexus

services:
  nexus:
    image: sonatype/nexus3:3.96.5
    container_name: cg-nexus
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      INSTALL4J_ADD_VM_PARAMS: ${NEXUS_JVM_PARAMS:--Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs}
    ports:
      - "${BIND_ADDRESS:?Defina BIND_ADDRESS}:${NEXUS_HTTP_PORT:-8081}:8081"
      - "${BIND_ADDRESS:?Defina BIND_ADDRESS}:${NEXUS_DOCKER_HOST_PORT:-8082}:8082"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  nexus-data:
