# Jenkins controller of CircleGuard (HU-01), configured entirely by JCasC (casc/jenkins.yaml):
# no setup wizard and no manual steps. Variables come from the .env that
# infra/bootstrap-jenkins.sh writes next to this file (mode 0600, never versioned).
#
# The integration tests and the HU-06 pipeline need a Docker daemon. Jenkins never gets the
# host's Docker socket: a separate Docker-in-Docker daemon (service "dind") is reachable only
# on the internal Compose network (no published port, TLS off because nothing else can reach
# it), and its containers disappear with its volume.
name: circleguard-jenkins

services:
  jenkins:
    build:
      context: .
    image: circleguard-jenkins:2.580.2-lts-jdk21-casc2144-crane0.22.1-ci3
    container_name: cg-jenkins
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      dind:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc/jenkins.yaml
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:?Defina JENKINS_ADMIN_USER}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Defina JENKINS_ADMIN_PASSWORD}
      CG_JENKINS_URL: ${CG_JENKINS_URL:?Defina CG_JENKINS_URL}
      CG_LIBRARY_REMOTE: ${CG_LIBRARY_REMOTE:-https://github.com/ingesoft5/circle-guard-finalproject_A00400179_A00399934_A00399492.git}
      # Registry (CNCF Distribution on the nexus server): address and the "ci" user, for crane.
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-}
      REGISTRY_CI_USER: ${REGISTRY_CI_USER:?Defina REGISTRY_CI_USER}
      REGISTRY_CI_PASSWORD: ${REGISTRY_CI_PASSWORD:?Defina REGISTRY_CI_PASSWORD}
      # Testcontainers and the HU-06 pipeline talk to the dind daemon; the containers it starts
      # publish their ports there.
      DOCKER_HOST: tcp://dind:2375
      TESTCONTAINERS_HOST_OVERRIDE: dind
    ports:
      - "${BIND_ADDRESS:?Defina BIND_ADDRESS}:${JENKINS_HTTP_PORT:-8080}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc/jenkins.yaml:/usr/share/jenkins/casc/jenkins.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  dind:
    image: docker:27.5.1-dind
    container_name: cg-jenkins-dind
    restart: ${RESTART_POLICY:-unless-stopped}
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    dns:
      - "${DIND_DNS:-8.8.8.8}"
    command:
      - "--storage-driver=overlay2"
      - "--insecure-registry=${REGISTRY_ADDRESS:-127.0.0.1:5000}"
      - "--log-opt"
      - "max-size=10m"
      - "--log-opt"
      - "max-file=2"
    volumes:
      - dind_data:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  jenkins_home:
  dind_data:
