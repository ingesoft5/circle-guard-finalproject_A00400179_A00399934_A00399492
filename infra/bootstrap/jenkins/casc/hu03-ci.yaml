unclassified:
  globalLibraries:
    libraries:
      - name: "circleguard"
        defaultVersion: "dev"
        implicit: true
        allowVersionOverride: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/ingesoft5/circle-guard-finalproject_A00400179_A00399934_A00399492.git"
                credentialsId: "github-token"
        libraryPath: "jenkins/"
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "${CG_SONARQUBE_URL:-http://sonarqube:9000}"
        credentialsId: "sonar-token"
