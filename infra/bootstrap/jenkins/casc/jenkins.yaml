# Jenkins Configuration as Code of CircleGuard (HU-01).
# ${...} values are resolved by JCasC from the container environment, which
# infra/bootstrap-jenkins.sh fills from the secret manager. Nothing secret is versioned.
jenkins:
  systemMessage: "CircleGuard - Jenkins aprovisionado por infra/bootstrap-jenkins.sh (HU-01). Configuracion gestionada como codigo."
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "${CG_JENKINS_URL}"
  globalLibraries:
    libraries:
      - name: "circleguard"
        defaultVersion: "dev"
        implicit: true
        allowVersionOverride: true
        retriever:
          modernSCM:
            libraryPath: "jenkins/"
            scm:
              git:
                remote: "${CG_LIBRARY_REMOTE:-https://github.com/ingesoft5/circle-guard-finalproject_A00400179_A00399934_A00399492.git}"
                credentialsId: "github-token"
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "${CG_SONARQUBE_URL:-http://sonarqube:9000}"
        credentialsId: "sonar-token"
