# Jenkins Configuration as Code of CircleGuard (HU-01).
# ${...} values are resolved by JCasC from the container environment, which
# infra/bootstrap-jenkins.sh fills from the secret manager. Nothing secret is versioned.
jenkins:
  systemMessage: "CircleGuard - Jenkins aprovisionado por infra/bootstrap-jenkins.sh (HU-01). Configuracion gestionada como codigo."
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "${JENKINS_DEV_USER}"
          password: "${JENKINS_DEV_PASSWORD}"
        - id: "${JENKINS_VIEWER_USER}"
          password: "${JENKINS_VIEWER_PASSWORD}"
  # HU-14: role-based access (plugin role-strategy). Anonymous users have no access at all.
  #   admin     Overall/Administer: Jenkins, credentials, plugins and the production approval (input submitter 'admin').
  #   developer read and run jobs (build, cancel, replay), look at the workspace; no administration, no credentials.
  #   viewer    read only.
  # Validated on a throwaway controller by security/jenkins/validate-rbac-live.sh.
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Administrators: manage Jenkins and its credentials"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_USER}"
          - name: "developer"
            description: "Run and inspect jobs; no administration, no credentials"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Run/Replay"
              - "View/Read"
            entries:
              - user: "${JENKINS_DEV_USER}"
          - name: "viewer"
            description: "Read only"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "View/Read"
            entries:
              - user: "${JENKINS_VIEWER_USER}"
unclassified:
  location:
    url: "${CG_JENKINS_URL}"
  globalLibraries:
    libraries:
      - name: "circleguard"
        defaultVersion: "dev"
        implicit: true
        allowVersionOverride: true
        retriever:
          modernSCM:
            libraryPath: "jenkins/"
            scm:
              git:
                remote: "${CG_LIBRARY_REMOTE:-https://github.com/ingesoft5/circle-guard-finalproject_A00400179_A00399934_A00399492.git}"
                credentialsId: "github-token"
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "${CG_SONARQUBE_URL:-http://sonarqube:9000}"
        credentialsId: "sonar-token"
